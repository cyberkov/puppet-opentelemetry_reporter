# End to end test topology: agent -> server -> collector.
#
# Brought up by run.sh, which waits for the server, triggers an agent run and
# asserts on the collector's Prometheus endpoint.

services:
  collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:latest
    container_name: otel-e2e-collector
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:z
      # Span output, bind mounted so the assertions can read it from the host.
      # The container cannot be read from: the image is distroless, so there is
      # no shell or cat to exec. run.sh creates this directory world writable
      # before starting the stack, because the collector runs as a non root
      # user and the exporter aborts startup if it cannot open the file.
      - ./spans:/data:z
    ports:
      # Exposed so the assertions can scrape from the host.
      - '8889:8889'
    # The collector is the only service that can confirm it is actually
    # listening, and both other services are useless without it.
    healthcheck:
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - puppet

  server:
    image: ghcr.io/openvoxproject/openvoxserver:8
    container_name: otel-e2e-server
    hostname: puppet
    environment:
      # The agent connects to "puppet"; the certificate must match.
      CERTNAME: puppet
      DNS_ALT_NAMES: puppet,server,localhost
      # Enable the processor. The image reads OPENVOX_REPORTS, not
      # PUPPETSERVER_REPORTS, and writes it to the [server] section of
      # puppet.conf from /container-entrypoint.d/85-setup-storeconfigs.sh.
      #
      # The image default is "puppetdb", which must be overridden: there is no
      # PuppetDB in this stack, and leaving it would bury the result in
      # unrelated report submission errors. "store" keeps reports on disk.
      OPENVOX_REPORTS: store,opentelemetry
      # The server JVM is the memory hungry part of this stack.
      JAVA_ARGS: '-Xms512m -Xmx1g'
    volumes:
      # The generated single file processor, installed into a module so that
      # the server autoloads it the same way pluginsync would.
      - ../../dist/opentelemetry.rb:/etc/puppetlabs/code/environments/production/modules/opentelemetry_reporter/lib/puppet/reports/opentelemetry.rb:z
      - ./otel.yaml:/etc/puppetlabs/puppet/otel.yaml:z
      - ./site.pp:/etc/puppetlabs/code/environments/production/manifests/site.pp:z
    depends_on:
      collector:
        condition: service_healthy
    # The server takes minutes to boot, and the agent is only useful once it
    # answers. Gating on this is what stops the agent sitting in Created.
    healthcheck:
      test:
        ['CMD', 'curl', '-ksf', 'https://localhost:8140/status/v1/simple']
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    networks:
      - puppet

  agent:
    image: ghcr.io/openvoxproject/openvoxagent:8
    container_name: otel-e2e-agent
    hostname: agent.example.com
    # The image entrypoint is the puppet binary itself, so a bare command is
    # parsed as a puppet subcommand. The entrypoint is overridden here to keep
    # the container idling, and run.sh execs the agent into it on demand.
    entrypoint: ['sleep']
    command: ['infinity']
    depends_on:
      server:
        condition: service_healthy
    networks:
      - puppet

networks:
  puppet:
    driver: bridge
