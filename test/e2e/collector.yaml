# Collector configuration for the end to end test.
#
# Metrics are exposed for scraping on :8889 and echoed to the container log,
# so a failing test can be diagnosed from either side. Spans have no scrape
# endpoint, so they are written to a file the test reads instead.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # No batching delay: the test asserts on metrics shortly after a single
  # agent run, and waiting on a batch timeout would only add flakiness.
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

  # Spans are written as JSON lines the test can grep, because there is no
  # scrape endpoint for traces the way there is for metrics.
  file:
    path: /tmp/spans.json

  prometheus:
    endpoint: 0.0.0.0:8889
    # Copies resource attributes onto every metric, so the test can assert on
    # service_name and host_name without a target_info join. Replaces
    # resource_to_telemetry_conversion, which is deprecated.
    resource_constant_labels:
      included: ["*"]

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]
